name: Repository keepalive
on:
  schedule:
    - cron: '17 3 1 * *'
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/keepalive-last-run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/keepalive-last-run.txt
          git diff --cached --quiet || git commit -m 'chore: monthly keepalive'
          git push
